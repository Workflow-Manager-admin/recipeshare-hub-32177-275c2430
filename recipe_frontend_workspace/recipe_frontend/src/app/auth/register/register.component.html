<section class="auth-container">
  <form [formGroup]="registerForm" (ngSubmit)="register()">
    <h1>Register</h1>
    <label>
      <input placeholder="Username" formControlName="username" autocomplete="username" required>
    </label>
    <label>
      <input placeholder="Email" formControlName="email" autocomplete="email" type="email" required>
    </label>
    <label>
      <input placeholder="Password" type="password" formControlName="password" autocomplete="new-password" required>
    </label>
    <button type="submit" class="btn" [disabled]="loading || registerForm.invalid">
      {{ loading ? "Registering..." : "Register" }}
    </button>
    <div class="error" *ngIf="error">{{ error }}</div>
    <div class="switch-auth">
      Already have an account? <a [routerLink]="['/login']">Login</a>
    </div>
  </form>
</section>
