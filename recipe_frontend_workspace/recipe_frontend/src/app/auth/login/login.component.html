<section class="auth-container">
  <form [formGroup]="loginForm" (ngSubmit)="login()">
    <h1>Sign in</h1>
    <label>
      <input placeholder="Username" formControlName="username" autocomplete="username" required>
    </label>
    <label>
      <input placeholder="Password" type="password" formControlName="password" autocomplete="current-password" required>
    </label>
    <button type="submit" class="btn" [disabled]="loading || loginForm.invalid">
      {{ loading ? "Signing in..." : "Login" }}
    </button>
    <div class="error" *ngIf="error">{{ error }}</div>
    <div class="switch-auth">
      Don't have an account? <a [routerLink]="['/register']">Register</a>
    </div>
  </form>
</section>
